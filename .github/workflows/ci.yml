name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hayat
          POSTGRES_USER: hayat
          POSTGRES_PASSWORD: hayat_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hayat" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://hayat:hayat_ci_password@127.0.0.1:5432/hayat
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python manage.py makemigrations --check --dry-run
        env: { DJANGO_SETTINGS_MODULE: config.settings.test }
      - run: uv run pytest --create-db -p no:warnings
      - name: OpenAPI schema is up to date
        run: |
          uv run python manage.py spectacular --file /tmp/openapi.yaml
          diff -q /tmp/openapi.yaml ../packages/api-client/openapi.yaml
        env: { DJANGO_SETTINGS_MODULE: config.settings.test }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hayat/web exec tsc --noEmit
      - run: pnpm --filter @hayat/web build
