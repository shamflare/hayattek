    get:
      operationId: admin_audit_list
      description: Security log for platform operators. Contains identifiers only,
        no clinical content.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor_id
        schema:
          type: string
      - in: query
        name: organization_id
