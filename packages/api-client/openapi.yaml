openapi: 3.0.3
info:
  title: HAYAT Healthcare Network API
  version: 1.0.0
  description: REST API shared by the HAYAT web and mobile apps.
paths:
  /api/v1/access:
    get:
      operationId: access_list
      description: Clinicians obtain consent to read network records.
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: string
        required: true
      tags:
      - access
      security:
      - deviceToken: []
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatientAccessStateList'
          description: ''
  /api/v1/access-grants:
    get:
      operationId: access_grants_list
      description: Effective grants held by the acting organization (e.g. 'shared
        with us' list).
      parameters:
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      tags:
      - access-grants
      security:
      - deviceToken: []
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGrantList'
          description: ''
  /api/v1/access/in-person:
    post:
      operationId: access_in_person_create
      description: Clinicians obtain consent to read network records.
      tags:
      - access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InPersonGrantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InPersonGrantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InPersonGrantRequest'
        required: true
      security:
      - deviceToken: []
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
          description: ''
  /api/v1/access/requests:
    post:
      operationId: access_requests_create
      description: Clinicians obtain consent to read network records.
      tags:
      - access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessRequestCreateRequest'
        required: true
      security:
      - deviceToken: []
      - sessionCookie: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
          description: ''
