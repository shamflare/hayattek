    post:
      operationId: access_requests_verify_otp_create
      description: Clinicians obtain consent to read network records.
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
