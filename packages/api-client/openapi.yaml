components:
  schemas:
    AccessLogEntry:
      type: object
      properties:
        occurred_at:
          type: string
          format: date-time
        action:
          type: string
        outcome:
          type: string
        actor_name:
          type: string
          nullable: true
        organization_name:
          type: string
          nullable: true
      required:
      - action
      - actor_name
      - occurred_at
      - organization_name
      - outcome
    AccessRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
        patient_name:
          type: string
          readOnly: true
        organization:
          type: string
          format: uuid
        organization_name:
          type: string
          readOnly: true
        practitioner:
          type: string
          format: uuid
          nullable: true
        practitioner_name:
          type: string
          readOnly: true
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        duration_hours:
          type: integer
          maximum: 2147483647
          minimum: 0
        note:
          type: string
          maxLength: 300
        status:
          $ref: '#/components/schemas/AccessStatusEnum'
        expires_at:
          type: string
          format: date-time
          description: Request must be decided before this time.
        decided_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - expires_at
      - id
      - organization
      - organization_name
      - patient
      - patient_name
      - practitioner_name
      - scopes
    AccessRequestCreateRequest:
      type: object
      properties:
        patient_id:
          type: string
          format: uuid
        health_number:
          type: string
          maxLength: 20
        card_token:
          type: string
          maxLength: 60
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
          minItems: 1
        hours:
          type: integer
          minimum: 1
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        note:
          type: string
          maxLength: 300
      required:
      - channel
      - hours
      - scopes
    AccessStatusEnum:
      enum:
      - pending
      - approved
      - denied
      - expired
      - cancelled
      type: string
      description: |-
        * `pending` - بانتظار الموافقة
        * `approved` - تمت الموافقة
        * `denied` - مرفوض
        * `expired` - منتهي
        * `cancelled` - ملغى
    AccountActivated:
      type: object
      properties:
        setup_link:
          type: string
      required:
      - setup_link
    ActivateAccountRequest:
      type: object
      properties:
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 20
    AdminStats:
      type: object
      properties:
        organizations_by_kind:
          type: object
          additionalProperties:
            type: integer
        organizations_active:
          type: integer
        practitioners_verified:
          type: integer
        practitioners_pending:
          type: integer
        patients_total:
          type: integer
        encounters_last_30_days:
          type: integer
        prescriptions_last_30_days:
          type: integer
        denied_access_last_7_days:
          type: integer
      required:
      - denied_access_last_7_days
      - encounters_last_30_days
      - organizations_active
      - organizations_by_kind
      - patients_total
      - practitioners_pending
      - practitioners_verified
      - prescriptions_last_30_days
    Allergy:
      type: object
      description: Provenance fields every clinical record exposes.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        organization_name:
          type: string
          readOnly: true
          nullable: true
        author_name:
          type: string
          readOnly: true
        author_role:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status53dEnum'
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/Source6a0Enum'
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        finalized_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        version:
          type: integer
          readOnly: true
        amended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        can_edit:
          type: boolean
          readOnly: true
        can_amend:
          type: boolean
          readOnly: true
        encounter:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        substance:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryCefEnum'
          readOnly: true
        reaction:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - amended_at
      - author_name
      - author_role
      - can_amend
      - can_edit
      - category
      - created_at
      - encounter
      - finalized_at
      - id
      - is_active
      - occurred_at
      - organization
      - organization_name
      - patient
      - reaction
      - severity
      - source
      - status
      - status_reason
      - substance
      - version
    AllergyWriteRequest:
      type: object
      properties:
        patient:
          type: string
          format: uuid
          writeOnly: true
        encounter:
          type: string
          format: uuid
          nullable: true
        substance:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/CategoryCefEnum'
        reaction:
          type: string
          maxLength: 300
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        is_active:
