          type: string
      - in: query
        name: outcome
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: patient_id
        schema:
          type: string
      tags:
      - admin
      security:
      - deviceToken: []
      - sessionCookie: []
      responses:
        '200':
