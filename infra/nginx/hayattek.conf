# TLS termination in front of the web app. Certificates: Let's Encrypt (certbot) or the host's CA.
server {
    listen 80;
    server_name hayattek.com www.hayattek.com;
    # Let's Encrypt HTTP-01 renewals (certbot --webroot, see docker-compose.prod.yml "certbot").
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://hayattek.com$request_uri;
    }
}

# www → apex over HTTPS too (the certificate covers both names).
server {
    listen 443 ssl;
    http2 on;
    server_name www.hayattek.com;
    ssl_certificate     /etc/letsencrypt/live/hayattek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hayattek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://hayattek.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hayattek.com;

    ssl_certificate     /etc/letsencrypt/live/hayattek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hayattek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    client_max_body_size 30m;           # uploads are capped at 25 MB by the API
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $http_host;          # keep the port so CSRF Origin checks match
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;   # Django trusts this (SECURE_PROXY_SSL_HEADER)

    # Same origin for the browser (ADR-003), but /api goes straight to Django so the
    # Host and scheme Django sees are the public ones, not Next's internal proxy hop.
    # Resolve upstreams per request (Docker DNS) so nginx starts even if a service is late.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:3100;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 90s;
    }
    location / {
        proxy_pass $web_upstream;
    }
}
