# TLS termination in front of the web app. Certificates: Let's Encrypt (certbot) or the host's CA.
server {
    listen 80;
    server_name hayattek.com www.hayattek.com;
    return 301 https://hayattek.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hayattek.com;

    ssl_certificate     /etc/letsencrypt/live/hayattek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hayattek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    client_max_body_size 30m;           # uploads are capped at 25 MB by the API
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://web:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    # The web app proxies /api to Django; Django trusts X-Forwarded-Proto (SECURE_PROXY_SSL_HEADER).
}
