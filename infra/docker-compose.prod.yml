# HayatTek production stack (TEMPLATE — not deployed; see docs/PRODUCTION_READINESS.md).
# Every secret comes from Docker secrets / env files that are NOT in git.
#   docker compose -f infra/docker-compose.prod.yml --env-file /srv/hayat/prod.env up -d
# Only nginx publishes ports. Postgres may be replaced by a managed database.

name: hayat-prod

x-backend: &backend
  build: { context: .., dockerfile: infra/docker/backend.Dockerfile }
  env_file: /srv/hayat/prod.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  restart: unless-stopped
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/hayattek.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [web]
    restart: unless-stopped
    networks: [internal]

  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    environment:
      HAYAT_API_ORIGIN: http://api:8000
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s

  api:
    <<: *backend
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 30s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]

  postgres:
    image: postgres:16-alpine
    env_file: /srv/hayat/postgres.env
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  clamav:
    image: clamav/clamav:1.4
    volumes: [clamdb:/var/lib/clamav]
    restart: unless-stopped
    networks: [internal]

  ocr:
    build: { context: ./ocr }
    read_only: true
    restart: unless-stopped
    networks: [internal]

  orthanc:
    image: orthancteam/orthanc:latest
    env_file: /srv/hayat/orthanc.env
    volumes: [orthancdata:/var/lib/orthanc/db]
    restart: unless-stopped
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  clamdb:
  orthancdata:

networks:
  internal:
