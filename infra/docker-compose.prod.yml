# HayatTek production stack (TEMPLATE — not deployed; see docs/PRODUCTION_READINESS.md).
# Every secret comes from Docker secrets / env files that are NOT in git.
#   HAYAT_ENV_DIR=/srv/hayat docker compose -f infra/docker-compose.prod.yml up -d --build
# Only nginx publishes ports. Postgres may be replaced by a managed database.
# Local rehearsal (throwaway secrets, self-signed TLS): infra/prodcheck/README.md

name: hayat-prod

x-backend: &backend
  build: { context: .., dockerfile: infra/docker/backend.Dockerfile }
  env_file: ${HAYAT_ENV_DIR:-/srv/hayat}/prod.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  restart: unless-stopped
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HAYAT_HTTP_BIND:-80}:80"
      - "${HAYAT_HTTPS_BIND:-443}:443"
    volumes:
      - ./nginx/hayattek.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HAYAT_CERT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on: [web, api]
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args: { HAYAT_API_ORIGIN: "http://api:8000" }
    environment:
      HAYAT_API_ORIGIN: http://api:8000
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s

  api:
    <<: *backend
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"]
    healthcheck:
      # Send the public host + scheme so ALLOWED_HOSTS and the HTTPS redirect behave as for real traffic.
      test: ["CMD", "python", "-c", "import os,urllib.request as u;h=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0];u.urlopen(u.Request('http://127.0.0.1:8000/api/health/ready',headers={'Host':h,'X-Forwarded-Proto':'https'}))"]
      interval: 30s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]

  postgres:
    image: postgres:16-alpine
    env_file: ${HAYAT_ENV_DIR:-/srv/hayat}/postgres.env
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  clamav:
    image: clamav/clamav:1.4
    volumes: [clamdb:/var/lib/clamav]
    restart: unless-stopped
    networks: [internal]

  ocr:
    build: { context: ./ocr }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [internal]

  orthanc:
    image: orthancteam/orthanc:25.9.0
    env_file: ${HAYAT_ENV_DIR:-/srv/hayat}/orthanc.env
    volumes: [orthancdata:/var/lib/orthanc/db]
    restart: unless-stopped
    networks: [internal]

  # On demand / cron: `docker compose -f infra/docker-compose.prod.yml run --rm backup`
  # Writes encrypted dumps to HAYAT_BACKUP_DIR; copy that directory off-site.
  backup:
    build: { context: ./backup }
    profiles: [ops]
    env_file: ${HAYAT_ENV_DIR:-/srv/hayat}/prod.env
    environment:
      BACKUP_DIR: /backups
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
    volumes:
      - ${HAYAT_BACKUP_DIR:-/srv/backups}:/backups
      - ${HAYAT_ENV_DIR:-/srv/hayat}/backup_passphrase:/run/secrets/backup_passphrase:ro
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  clamdb:
  orthancdata:

networks:
  internal:
